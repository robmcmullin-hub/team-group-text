<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Team Group Text</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#14202e; --muted:#5b6878; --line:#dbe1e8;
  --accent:#0b4f9c; --accent-fg:#ffffff; --soft:#e6eef8; --sel:#e3edfa;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e141c; --surface:#16202b; --fg:#e7edf4; --muted:#9aa8b8; --line:#2a3644;
  --accent:#5aa2f0; --accent-fg:#06121f; --soft:#1c2c3e; --sel:#1a2f47; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 210px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fam{border-top:1px solid var(--line)}
.fam:first-child{border-top:0}
.player{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:10px 14px 2px}
label.row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
label.row:has(input:checked){background:var(--sel)}
label.row input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.name{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:15px}
.none{padding:6px 14px 10px 48px;color:var(--muted);font-size:14px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--muted)}
.pinform{display:flex;flex-direction:column;gap:10px;color:var(--fg)}
.pinform p{color:var(--muted)}
.pinform input{font:600 22px var(--body);letter-spacing:.3em;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.pinform input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.pinerr{color:#c0392b;font-weight:600;min-height:1.2em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;font:600 17px var(--body);padding:13px 12px;border-radius:10px;border:0;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-fg)}
.primary[aria-disabled="true"]{opacity:.45;pointer-events:none}
.pair{display:flex;gap:8px}
.pair .btn{flex:1;font-size:15px;padding:10px 8px;background:var(--soft);color:var(--fg)}
.toast{color:var(--accent);font-weight:600;font-size:14px;min-height:1.2em;margin:0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Team Group Text</h1>
  <p class="sub">Tick who's here this weekend, then tap Open group text. Messages opens with them filled in (iPhone or Android); you write and send the first message. Leave yourself unticked.</p>
  <div class="tools">
    <button class="chip" id="clearBtn" type="button">Clear all</button>
  </div>
  <div id="list"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <a class="btn primary" id="openBtn">Open group text</a>
    <div class="pair">
      <a class="btn" id="altBtn">Not everyone filled? Try this</a>
      <button class="btn" id="copyBtn" type="button">Copy numbers</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
  </div>
</div>

<script>
// The contact list is NOT readable on this site. It is stored encrypted in data.bin.
// Unlocking needs BOTH the code in the link (after #k=, which browsers never send
// to the web server) AND the team PIN. Format: 12-byte IV + AES-GCM ciphertext of
// UTF-8 JSON {t:title, f:[[group,[[name,digits|null],...]],...]}.
const ITER=310000; // must match build_locked_list.py
let cipher=null;
async function loadCipher(){
  if(cipher)return cipher;
  const res=await fetch("data.bin?t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("fetch");
  cipher=new Uint8Array(await res.arrayBuffer());
  return cipher;
}
async function unlock(h,pin){
  let s=h.replace(/^#k=/,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  const salt=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const buf=await loadCipher();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:ITER},base,{name:"AES-GCM",length:128},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
const listEl=document.getElementById("list");
const openBtn=document.getElementById("openBtn"),altBtn=document.getElementById("altBtn"),toast=document.getElementById("toast");
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const fmt=n=>n.length===10?`${n.slice(0,3)}-${n.slice(3,6)}-${n.slice(6)}`:n;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let boxes=[];
const KEY="tgt-sel-k";
const PINKEY="tgt-pin";
openBtn.textContent="Locked";openBtn.setAttribute("aria-disabled","true");
function showMsg(t){listEl.innerHTML=`<div class="empty">${t}</div>`;}
function showPinForm(err){
  listEl.innerHTML=`<form class="empty pinform" id="pinForm">
    <label for="pinInput"><strong>Enter the team PIN</strong></label>
    <p style="margin:0">Ask the team manager for it. You only need to enter it once on this phone.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <button class="btn primary" type="submit" id="pinBtn">Unlock</button>
    <p class="pinerr" id="pinErr" role="alert">${err||""}</p>
  </form>`;
  const f=document.getElementById("pinForm"),inp=document.getElementById("pinInput");
  inp.focus();
  f.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const pin=inp.value.trim();
    if(!pin)return;
    document.getElementById("pinBtn").textContent="Unlocking…";
    await tryPin(pin,true);
  });
}
async function tryPin(pin,fromForm){
  let data;
  try{data=await unlock(location.hash,pin);}
  catch(e){
    if(e&&e.message==="fetch"){showMsg("Could not reach the contact list. Check your connection and reload the page.");return;}
    try{localStorage.removeItem(PINKEY);}catch(_){}
    showPinForm(fromForm?"That PIN didn't work. Try again.":"");
    return;
  }
  try{localStorage.setItem(PINKEY,pin);}catch(_){}
  render(data);
}
(async()=>{
if(!location.hash.startsWith("#k=")){
  showMsg("This link is missing its code. Check that you have the full link (including the part after #), or ask the person who shared it.");
  return;
}
let stored=null;
try{stored=localStorage.getItem(PINKEY);}catch(_){}
if(stored)await tryPin(stored,false);else showPinForm("");
})();
function render(data){
if(!data||!Array.isArray(data.f)){
  showMsg("Could not read the contact list. Ask the person who shared it for a new link.");
}else{
  if(data.t){document.getElementById("title").textContent=data.t;document.title=data.t;}
  const wrap=document.createElement("div");wrap.className="list";
  data.f.forEach(([player,parents])=>{
    const fam=document.createElement("div");fam.className="fam";
    let html=`<div class="player">${esc(player)}</div>`;
    parents.forEach(([name,num])=>{
      if(num){
        html+=`<label class="row"><input type="checkbox" value="${esc(num)}"><span class="name">${esc(name)}</span><span class="num">${fmt(num)}</span></label>`;
      }else{
        html+=`<div class="none">${esc(name)}: no cell number on file</div>`;
      }
    });
    fam.innerHTML=html;wrap.appendChild(fam);
  });
  listEl.appendChild(wrap);
  boxes=[...wrap.querySelectorAll("input[type=checkbox]")];
  wrap.addEventListener("change",update);
}
let saved=null;
try{saved=JSON.parse(localStorage.getItem(KEY));}catch(e){}
setSel(Array.isArray(saved)?saved:[]);
}
function selected(){return boxes.filter(b=>b.checked).map(b=>b.value);}
function update(){
  const s=selected();
  const nums=s.map(n=>n.length===10?"+1"+n:n);
  openBtn.textContent=s.length?`Open group text (${s.length})`:"Tick people to start";
  openBtn.setAttribute("aria-disabled",s.length?"false":"true");
  if(isIOS){
    openBtn.href="sms://open?addresses="+nums.join(",");
    altBtn.href="sms:/open?addresses="+nums.join(",");
  }else{
    openBtn.href="sms:"+nums.join(",");
    altBtn.href="sms:"+nums.join(";");
  }
  toast.textContent="";
  try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}
}
function setSel(arr){boxes.forEach(b=>b.checked=arr.includes(b.value));update();}
document.getElementById("clearBtn").addEventListener("click",()=>setSel([]));
document.getElementById("copyBtn").addEventListener("click",()=>{
  const s=selected();
  if(!s.length){toast.textContent="Tick at least one person first";return;}
  const text=s.map(fmt).join(", ");
  const done=()=>{toast.textContent=`Copied ${s.length} numbers`;};
  const fallback=()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(_){toast.textContent="Couldn't copy. The numbers are listed above.";}
    ta.remove();
  };
  try{navigator.clipboard.writeText(text).then(done).catch(fallback);}catch(e){fallback();}
});
</script>
</body>
</html>
